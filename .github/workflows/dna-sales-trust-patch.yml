name: DNA mobile refinement

on:
  push:
    paths:
      - '.github/workflows/dna-sales-trust-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine DNA mobile sales page
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('dna-dos-contratos.html')
          html = path.read_text(encoding='utf-8')

          # Copy dos três eixos
          html = html.replace(
              'Você precisa saber contratos. Mas também precisa saber trabalhar com eles.',
              'Você precisa dominar a técnica para elaborar contratos.'
          )

          html = html.replace(
              'Por isso a formação foi construída em três eixos que acompanham a realidade da atuação profissional.',
              'No DNA, essa técnica é desenvolvida junto com a visão negocial e a capacidade de transformar o conhecimento jurídico em um serviço profissional, bem apresentado e bem cobrado.'
          )

          marker_start = '/* ===== MOBILE DNA AJUSTADO - INÍCIO ===== */'
          marker_end = '/* ===== MOBILE DNA AJUSTADO - FIM ===== */'

          mobile_css = r'''

/* ===== MOBILE DNA AJUSTADO - INÍCIO ===== */
@media (max-width: 680px){

  html{
    -webkit-text-size-adjust:100%;
    overflow-x:hidden;
  }

  body{
    overflow-x:hidden;
    font-size:16px;
    line-height:1.55;
    padding-bottom:70px;
  }

  .container{
    width:calc(100% - 36px) !important;
    max-width:none !important;
    margin-left:auto !important;
    margin-right:auto !important;
  }

  section{
    padding:52px 0 !important;
  }

  h1{
    font-size:2.34rem !important;
    line-height:1.04 !important;
    letter-spacing:-.032em !important;
    margin-bottom:18px !important;
    max-width:100% !important;
  }

  h2{
    font-size:1.95rem !important;
    line-height:1.09 !important;
    letter-spacing:-.03em !important;
    margin-bottom:16px !important;
    max-width:100% !important;
  }

  h3{
    font-size:1.34rem !important;
    line-height:1.14 !important;
    letter-spacing:-.022em !important;
  }

  .eyebrow{
    font-size:.63rem !important;
    letter-spacing:.14em !important;
    line-height:1.25 !important;
    margin-bottom:13px !important;
  }

  .topo{
    padding:4px 0 !important;
  }

  .logo{
    width:156px !important;
    height:72px !important;
  }

  .top-status{
    max-width:120px !important;
    white-space:normal !important;
    text-align:right !important;
    font-size:.45rem !important;
    line-height:1.25 !important;
    letter-spacing:.06em !important;
  }

  /* abertura */
  .abertura{
    padding:88px 0 44px !important;
  }

  .abertura-video{
    margin-bottom:26px !important;
  }

  .video-label{
    margin-bottom:8px !important;
    font-size:.57rem !important;
  }

  .video-box{
    padding:4px !important;
    border-radius:14px !important;
  }

  .video-stage{
    border-radius:10px !important;
  }

  .play{
    width:56px !important;
    height:56px !important;
    font-size:1.18rem !important;
  }

  .abertura-copy{
    text-align:left !important;
  }

  .abertura-lead,
  .abertura-mini{
    text-align:justify !important;
    text-justify:inter-word;
    hyphens:auto;
    -webkit-hyphens:auto;
  }

  .abertura-lead{
    font-size:.98rem !important;
    line-height:1.55 !important;
    margin:0 !important;
  }

  .abertura-acoes{
    display:block !important;
    margin-top:22px !important;
  }

  .abertura-acoes .btn{
    width:100% !important;
  }

  .abertura-mini{
    margin:12px 0 0 !important;
    font-size:.7rem !important;
  }

  /* condição/preço */
  .condicao{
    padding:30px 0 !important;
  }

  .condicao-grid{
    grid-template-columns:1fr !important;
    gap:17px !important;
  }

  .parcelas{
    font-size:2.35rem !important;
    line-height:1.03 !important;
  }

  .menos-cem,
  .obs{
    text-align:justify !important;
    text-justify:inter-word;
  }

  .menos-cem{
    font-size:.91rem !important;
    line-height:1.5 !important;
  }

  .condicao-cta .btn{
    width:100% !important;
    min-width:0 !important;
  }

  /* blocos de leitura */
  .dor-grid,
  .ponte-grid,
  .modulos-head,
  .apresentacao-grid,
  .oferta-grid{
    display:block !important;
  }

  .dor-grid > div:first-child,
  .ponte-grid > div:first-child{
    margin-bottom:25px !important;
  }

  .dor-grande,
  .ponte-grande{
    font-size:1.58rem !important;
    line-height:1.2 !important;
    letter-spacing:-.022em !important;
    margin-bottom:21px !important;
    text-align:justify !important;
    text-justify:inter-word;
    hyphens:auto;
    -webkit-hyphens:auto;
  }

  .dor-texto > p:not(.dor-grande),
  .ponte-texto > p:not(.ponte-grande),
  .metodo-intro,
  .modulos-head p,
  .mensagens-head p,
  .para-quem-intro p,
  .card-quem p,
  .apresentacao-texto p,
  .oferta-texto > p,
  .urgencia p,
  details p{
    font-size:.93rem !important;
    line-height:1.55 !important;
    text-align:justify !important;
    text-justify:inter-word;
    hyphens:auto;
    -webkit-hyphens:auto;
  }

  .dor-lista{
    margin-top:24px !important;
  }

  .dor-item{
    grid-template-columns:28px 1fr !important;
    gap:9px !important;
    padding:15px 0 !important;
  }

  .dor-item span{
    font-size:.9rem !important;
    line-height:1.48 !important;
    text-align:justify !important;
  }

  .servicos{
    grid-template-columns:1fr 1fr !important;
    gap:7px !important;
  }

  .servico{
    padding:13px !important;
    border-radius:11px !important;
    font-size:.78rem !important;
    line-height:1.3 !important;
  }

  /* depoimentos */
  .depoimentos-intro,
  .mensagens-head,
  .para-quem-intro{
    margin-bottom:26px !important;
  }

  .quotes,
  .provas-imagens,
  .pilares,
  .grid-quem{
    grid-template-columns:1fr !important;
    gap:8px !important;
  }

  .quote{
    min-height:0 !important;
    padding:20px !important;
    border-radius:16px !important;
  }

  .quote-mark{
    font-size:2.8rem !important;
  }

  .quote blockquote{
    margin:14px 0 18px !important;
    font-size:1.08rem !important;
    line-height:1.4 !important;
  }

  /* três eixos: sem buracos dentro dos cards */
  .metodo{
    padding:50px 0 !important;
  }

  .metodo-intro{
    margin-bottom:24px !important;
  }

  .pilar{
    padding:19px !important;
    border-radius:16px !important;
    min-height:0 !important;
  }

  .pilar-num{
    width:36px !important;
    height:36px !important;
    margin:0 0 13px 0 !important;
    font-size:.62rem !important;
  }

  .pilar h3{
    margin:0 0 9px !important;
    font-size:1.28rem !important;
  }

  .pilar p{
    margin:0 !important;
    font-size:.9rem !important;
    line-height:1.48 !important;
    text-align:justify !important;
  }

  /* módulos */
  .modulos-head{
    margin-bottom:24px !important;
  }

  .modulo{
    display:block !important;
    padding:17px 0 !important;
  }

  .modulo-num{
    display:block !important;
    margin-bottom:6px !important;
  }

  .modulo h3{
    margin:0 0 7px !important;
    font-size:1.22rem !important;
  }

  .modulo p{
    margin:0 !important;
    font-size:.89rem !important;
    line-height:1.48 !important;
    text-align:justify !important;
  }

  .modulo-destaque{
    display:block !important;
    padding:20px !important;
    margin:16px 0 !important;
    border-radius:16px !important;
  }

  .modulo-destaque h3{
    margin-bottom:9px !important;
  }

  .modulo-destaque p{
    text-align:justify !important;
    font-size:.89rem !important;
  }

  /* galeria */
  .story-grid{
    columns:2 !important;
    column-gap:7px !important;
  }

  .story{
    margin-bottom:7px !important;
    border-radius:9px !important;
  }

  /* apresentação e oferta */
  .apresentacao-foto{
    margin-bottom:24px !important;
    aspect-ratio:16/11 !important;
    border-radius:16px !important;
  }

  .numeros{
    gap:7px !important;
  }

  .numero{
    padding:14px !important;
  }

  .oferta-texto{
    margin-bottom:24px !important;
  }

  .oferta-card{
    padding:20px !important;
    border-radius:17px !important;
  }

  .oferta-card li{
    padding:9px 0 !important;
    font-size:.88rem !important;
  }

  .preco-card-atual{
    font-size:2.25rem !important;
  }

  /* selo Hotmart / garantia */
  .trust-visual{
    margin-top:18px !important;
    padding:12px 10px !important;
    border-radius:14px !important;
  }

  .trust-visual img{
    width:100% !important;
    max-width:100% !important;
  }

  .trust-visual-copy{
    margin-top:10px !important;
    font-size:.72rem !important;
    line-height:1.43 !important;
    text-align:center !important;
  }

  /* CTA fixo: discreto e sem bloquear conteúdo */
  .float{
    left:12px !important;
    right:12px !important;
    bottom:max(8px, env(safe-area-inset-bottom)) !important;
    padding:0 !important;
    background:transparent !important;
    box-shadow:none !important;
  }

  .float .btn{
    width:100% !important;
    min-height:48px !important;
    padding:11px 13px !important;
    border:0 !important;
    border-radius:999px !important;
    font-size:.58rem !important;
    line-height:1.2 !important;
    letter-spacing:.045em !important;
    white-space:nowrap !important;
    box-shadow:0 8px 24px rgba(0,0,0,.24) !important;
  }

  footer{
    padding-bottom:90px !important;
  }
}

@media (max-width:390px){
  h1{font-size:2.18rem !important;}
  h2{font-size:1.82rem !important;}
  .dor-grande,
  .ponte-grande{font-size:1.48rem !important;}
  .float .btn{font-size:.54rem !important;}
}
/* ===== MOBILE DNA AJUSTADO - FIM ===== */
'''

          # Remove uma eventual versão anterior deste patch e insere a atual no fim do CSS.
          pattern = re.compile(
              re.escape(marker_start) + r'.*?' + re.escape(marker_end),
              flags=re.S
          )
          html = pattern.sub('', html)
          html = html.replace('</style>', mobile_css + '\n</style>', 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit mobile refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dna-dos-contratos.html
          git diff --cached --quiet || git commit -m "Refine DNA mobile layout and copy"
          git push
