name: DNA sales trust patch

on:
  push:
    paths:
      - '.github/workflows/dna-sales-trust-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch DNA sales page
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('dna-dos-contratos.html')
          html = path.read_text(encoding='utf-8')

          trust_b64 = ""

          css = r'''

/* ====== BLOCO DE CONFIANÇA HOTMART ====== */
.trust-visual{
  width:100%;
  max-width:920px;
  margin:28px auto 0;
  padding:22px 24px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
  background:rgba(255,255,255,.035);
  text-align:center;
}

.trust-visual img{
  width:100%;
  max-width:760px;
  height:auto;
  margin:0 auto;
  display:block;
}

.trust-visual-copy{
  margin:16px auto 0;
  max-width:720px;
  color:rgba(255,255,255,.78);
  font-size:.86rem;
  line-height:1.5;
  text-align:center;
}

.trust-visual-copy strong{
  color:#fff;
}

.depoimento-extra{
  margin-top:15px;
  padding:28px;
  border:1px solid var(--linha);
  border-radius:21px;
  background:#faf8f4;
}

.depoimento-extra blockquote{
  margin:18px 0 20px;
  font-family:Georgia,serif;
  font-size:1.35rem;
  line-height:1.38;
}

.depoimento-extra small{
  display:block;
  padding-top:14px;
  border-top:1px solid var(--linha);
  color:var(--malbec);
  font-size:.75rem;
  font-weight:800;
}

@media(max-width:680px){
  .trust-visual{
    margin-top:20px;
    padding:14px 12px;
    border-radius:16px;
  }

  .trust-visual img{
    max-width:100%;
  }

  .trust-visual-copy{
    margin-top:12px;
    font-size:.76rem;
    line-height:1.45;
    text-align:center !important;
  }

  .depoimento-extra{
    margin-top:9px;
    padding:20px;
    border-radius:17px;
  }

  .depoimento-extra blockquote{
    font-size:1.1rem;
    line-height:1.42;
    text-align:left !important;
  }
}
'''

          if 'BLOCO DE CONFIANÇA HOTMART' not in html:
              html = html.replace('</style>', css + '\n</style>', 1)

          # Corrige a frase dos pilares se a versão anterior ainda estiver no arquivo.
          html = html.replace(
              'Você precisa saber contratos. Mas também precisa saber trabalhar com eles.',
              'Domine a técnica para elaborar contratos e aprenda a transformar esse conhecimento em uma atuação profissional.'
          )

          trust = f'''

    <div class="trust-visual">
      <img
        src="data:image/webp;base64,{trust_b64}"
        alt="Hotmart, formas de pagamento aceitas e garantia de 7 dias"
        loading="lazy"
      >
      <p class="trust-visual-copy">
        <strong>✓ Garantia de 7 dias.</strong>
        Você tem 7 dias para conhecer a formação e solicitar reembolso, caso decida não permanecer.
      </p>
    </div>
'''

          # Insere o bloco visual na seção de condição/preço.
          if 'Hotmart, formas de pagamento aceitas e garantia de 7 dias' not in html:
              start = html.find('<section class="condicao">')
              if start != -1:
                  end = html.find('</section>', start)
                  if end != -1:
                      html = html[:end] + trust + '\n' + html[end:]

          # Repete o bloco na oferta final para reforçar a segurança no momento da compra.
          if html.count('Hotmart, formas de pagamento aceitas e garantia de 7 dias') < 2:
              start = html.find('<section class="oferta"')
              if start != -1:
                  pos = html.find('<p class="checkout-info">', start)
                  if pos != -1:
                      close = html.find('</p>', pos)
                      if close != -1:
                          html = html[:close+4] + trust + html[close+4:]

          extra = r'''

    <article class="depoimento-extra">
      <div class="quote-mark">“</div>
      <blockquote>
        Dani, acabei de assistir o módulo comercial. Quantos insights, quanta experiência compartilhada. Só esse módulo já pagaria o curso inteiro. Já comprei vários cursos e nenhum foi tão claro como o seu. Grata!!!
      </blockquote>
      <small>Mariana — Aluna do DNA</small>
    </article>
'''

          if 'Só esse módulo já pagaria o curso inteiro' not in html:
              marker = '<!-- MAIS TRÊS DEPOIMENTOS REAIS EM IMAGEM -->'
              idx = html.find(marker)
              if idx == -1:
                  marker = '<!-- ==================================================\n     CTA APÓS PROVAS'
                  idx = html.find(marker)
              if idx != -1:
                  html = html[:idx] + extra + '\n\n' + html[idx:]

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dna-dos-contratos.html
          git diff --cached --quiet || git commit -m "Add Hotmart trust visual, guarantee and testimonial"
          git push
